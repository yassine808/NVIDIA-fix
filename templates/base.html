<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NVIDIA ShadowPlay Recovery{% endblock %}</title>
  <style>
    :root {
      --bg: #0c0e12;
      --panel: #141820;
      --panel-2: #1b202a;
      --line: #2a3140;
      --text: #e8ebf0;
      --muted: #98a2b3;
      --accent: #f5b544;
      --accent-dim: #8a6520;
      --good: #57d38c;
      --bad: #ff7a7a;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(900px 500px at 75% -10%, rgba(245,181,68,.10), transparent 60%),
        radial-gradient(700px 400px at 10% 0%, rgba(80,130,220,.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 34px 22px 70px; }
    header.site { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 52px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 650; letter-spacing: .2px; }
    .mark {
      width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--accent), #d98c16);
      color: #1a1204; font-weight: 900; font-size: 16px;
    }
    .tag { color: var(--muted); font-size: 12px; border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; }
    h1 { font-size: clamp(34px, 5vw, 54px); line-height: 1.06; letter-spacing: -1.5px; margin: 0 0 18px; }
    h1 span { color: var(--accent); }
    .lede { color: var(--muted); font-size: 17px; max-width: 620px; margin: 0 0 34px; }
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,.025), transparent), var(--panel);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 26px;
    }
    .drop {
      display: block; border: 1.5px dashed #3a4356; border-radius: 12px; padding: 38px 20px;
      text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
      background: rgba(255,255,255,.012);
    }
    .drop:hover, .drop.dragging { border-color: var(--accent); background: rgba(245,181,68,.05); }
    .drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
    .drop span { color: var(--muted); font-size: 13px; }
    .drop input { display: none; }
    .filename { margin-top: 14px; color: var(--accent); font-size: 13px; min-height: 20px; word-break: break-all; }
    button, .btn {
      appearance: none; border: 0; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #1b1305; font-weight: 700; font-size: 15px;
      padding: 13px 22px; border-radius: 10px; transition: filter .15s, opacity .15s;
    }
    button:hover, .btn:hover { filter: brightness(1.07); }
    button:disabled { opacity: .42; cursor: not-allowed; }
    .actions { margin-top: 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .hint { color: var(--muted); font-size: 12px; }
    .notice { margin: 0 0 20px; padding: 14px 16px; border-radius: 10px; font-size: 14px; }
    .notice.error { background: rgba(255,122,122,.08); border: 1px solid rgba(255,122,122,.3); color: #ffc1c1; }
    .notice.good { background: rgba(87,211,140,.08); border: 1px solid rgba(87,211,140,.3); color: #b9f3d0; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
    .mini { background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 16px; }
    .mini b { display: block; margin-bottom: 4px; font-size: 14px; }
    .mini p { margin: 0; color: var(--muted); font-size: 12.5px; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1.6px; color: var(--muted); margin: 44px 0 16px; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .step .n { color: var(--accent); font-weight: 800; font-size: 12px; letter-spacing: 1px; }
    .step h3 { margin: 5px 0 5px; font-size: 15px; }
    .step p { margin: 0; color: var(--muted); font-size: 13px; }
    .caveat { margin-top: 40px; border-left: 3px solid var(--accent-dim); padding: 2px 0 2px 16px; color: var(--muted); font-size: 13px; }
    footer { margin-top: 58px; padding-top: 20px; border-top: 1px solid var(--line); color: #6f798b; font-size: 12px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(6,8,12,.82); backdrop-filter: blur(4px);
      z-index: 50; place-items: center; text-align: center; padding: 24px;
    }
    .overlay.on { display: grid; }
    .spinner {
      width: 42px; height: 42px; border-radius: 50%; margin: 0 auto 18px;
      border: 3px solid rgba(245,181,68,.2); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay b { font-size: 17px; display: block; margin-bottom: 5px; }
    .overlay span { color: var(--muted); font-size: 13px; }

    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; margin-bottom: 18px; }
    .status.ok { color: #b9f3d0; background: rgba(87,211,140,.1); border: 1px solid rgba(87,211,140,.3); }
    .status.warn { color: #ffe0a3; background: rgba(245,181,68,.1); border: 1px solid rgba(245,181,68,.32); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 26px 0; }
    .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 15px; }
    .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .stat .v { font-size: 20px; font-weight: 700; margin-top: 4px; letter-spacing: -.4px; }
    .downloads { display: grid; gap: 10px; margin-top: 18px; }
    .dl {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 15px 17px;
      text-decoration: none; color: var(--text); transition: border-color .15s, transform .15s;
    }
    .dl:hover { border-color: var(--accent-dim); transform: translateY(-1px); }
    .dl b { font-size: 14px; display: block; }
    .dl small { color: var(--muted); font-size: 12px; }
    .dl .go { color: var(--accent); font-weight: 700; font-size: 12px; white-space: nowrap; }
    .evidence { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .evidence li { margin: 6px 0; }
    code { background: #0b0d11; border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; font-size: 12px; }

    @media (max-width: 760px) {
      .grid3, .steps { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      header.site { margin-bottom: 36px; }
      .panel { padding: 19px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div class="brand"><div class="mark">N</div> nvidia-fix</div>
      <div class="tag">local · ffmpeg stream copy</div>
    </header>
    {% block content %}{% endblock %}
    <footer>
      <span>Files are processed locally. Nothing is uploaded to a third party.</span>
      <span>v1.0.0</span>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
