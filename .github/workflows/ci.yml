name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 1 / Quality and docs
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every Python entry point
        run: python -m compileall -q nvidia_fix.py tests scripts forensics
      - name: Check the public CLI version
        run: python nvidia_fix.py --version
      - name: Check required release files
        run: |
          python -c "from pathlib import Path; readme = Path('README.md').read_text(encoding='utf-8'); assert 'releases/latest' in readme, 'README download link missing'; assert Path('LICENSE').is_file(), 'LICENSE missing'; assert Path('package.json').is_file(), 'package.json missing'; assert Path('build/icon.ico').is_file(), 'app icon missing'; print('release files OK')"

  unit:
    name: 2 / Unit and integration tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Verify ffmpeg is available
        run: ffmpeg -version
      - name: Run the full test suite
        run: python -m unittest discover -s tests -v

  desktop:
    name: 3 / Desktop app
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Type-check and build the Electron app
        run: npm run build

  cli:
    name: 4 / CLI recovery
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Recover a synthetic corrupted recording through the CLI
        run: python scripts/ci_e2e.py
